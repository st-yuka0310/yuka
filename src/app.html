<title>自炊貯金</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
  :root {
    --bg: #FFF5F1;
    --surface: #FFFFFF;
    --surface-2: #FFEAE3;
    --ink: #4A3239;
    --muted: #9C7F88;
    --line: #F7D9D0;
    --accent: #FF6F61;
    --accent-ink: #FFFFFF;
    --gold: #E39A00;
    --gold-soft: #FFEDB8;
    --mint: #D9F3EA;
    --mint-ink: #2E8A6E;
    --danger: #D2354B;
    --shadow: 0 6px 18px rgba(255, 111, 97, .12);
    --radius: 24px;
    --display: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Hiragino Sans", sans-serif;
    --body: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #221B20; --surface: #2D252B; --surface-2: #3A2F36; --ink: #F9ECEF;
      --muted: #C4A9B3; --line: #463A42; --accent: #FF8A7E; --accent-ink: #2B1412;
      --gold: #FFCB52; --gold-soft: #4D3B18; --mint: #1F3A33; --mint-ink: #86DDBF;
      --danger: #FF7D8E; --shadow: 0 6px 18px rgba(0, 0, 0, .3);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #221B20; --surface: #2D252B; --surface-2: #3A2F36; --ink: #F9ECEF;
      --muted: #C4A9B3; --line: #463A42; --accent: #FF8A7E; --accent-ink: #2B1412;
      --gold: #FFCB52; --gold-soft: #4D3B18; --mint: #1F3A33; --mint-ink: #86DDBF;
      --danger: #FF7D8E; --shadow: 0 6px 18px rgba(0, 0, 0, .3);
  }

  html, body { background: var(--bg); }
  body {
    color: var(--ink);
    font-family: var(--body);
    font-size: 15px;
    line-height: 1.6;
    -webkit-tap-highlight-color: transparent;
  }
  .wrap {
    max-width: 480px;
    margin: 0 auto;
    padding-inline: 16px;
    padding-block: 20px calc(96px + env(safe-area-inset-bottom, 0px));
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
  .yen { font-variant-numeric: tabular-nums; }

  /* お試しデータの案内 */
  .demo {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    background: var(--gold-soft); border-radius: 12px; padding: 10px 14px; font-size: 13px;
  }
  .demo button {
    background: none; border: 1px solid currentColor; border-radius: 999px;
    padding: 4px 12px; font-size: 13px; white-space: nowrap;
  }

  /* ヒーロー */
  .hero { display: flex; flex-direction: column; gap: 2px; padding-top: 4px; }
  .eyebrow { font-size: 13px; color: var(--muted); letter-spacing: 0.04em; }
  .big {
    font-family: var(--display); font-weight: 900;
    font-size: clamp(44px, 14vw, 60px); line-height: 1.1; letter-spacing: -0.01em;
  }
  .big small { font-size: 0.5em; font-weight: 700; margin-right: 2px; }
  .swap {
    align-self: flex-start;
    display: inline-flex; align-items: baseline; gap: 6px;
    background: none; border: 0; padding: 4px 0; text-align: left;
    font-family: var(--display); font-weight: 700; font-size: 20px;
  }
  .swap b { color: var(--gold); font-size: 30px; font-weight: 900; }
  .swap .hint { font-size: 12px; color: var(--muted); font-family: var(--body); font-weight: 400; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .chip {
    background: var(--mint); border-radius: 999px; padding: 3px 10px; font-size: 12.5px; color: var(--muted);
  }
  .chip b { color: var(--mint-ink); font-weight: 700; }

  /* おにぎりの応援キャラ */
  .buddy { display: grid; grid-template-columns: 92px 1fr; gap: 10px; align-items: center; }
  .buddy button { border: 0; background: none; padding: 0; }
  .mascot { width: 92px; height: auto; display: block; overflow: visible; }
  .mascot .arm { fill: none; stroke-linecap: round; }
  .mascot .arm-line { stroke: var(--line); stroke-width: 11; }
  .mascot .arm-fill { stroke: #FFFFFF; stroke-width: 7; }
  .mascot .up, .mascot .joy { display: none; }
  .mascot.cheer .up, .mascot.cheer .joy { display: inline; }
  .mascot.cheer .down, .mascot.cheer .calm { display: none; }
  .mascot.cheer { animation: hop .6s ease 2; }
  @keyframes hop { 0%, 100% { transform: translateY(0); } 40% { transform: translateY(-10px) rotate(-4deg); } 70% { transform: translateY(0) rotate(3deg); } }
  .mascot { animation: sway 3.2s ease-in-out infinite; transform-origin: 50% 90%; }
  @keyframes sway { 0%, 100% { transform: rotate(-2deg); } 50% { transform: rotate(2deg); } }
  .bubble {
    position: relative; background: var(--surface); border: 2px solid var(--line); border-radius: 20px;
    padding: 10px 14px; font-weight: 700; font-size: 14.5px; line-height: 1.55; box-shadow: var(--shadow);
  }
  .bubble::before {
    content: ""; position: absolute; left: -9px; top: 50%; width: 14px; height: 14px; margin-top: -7px;
    background: var(--surface); border-left: 2px solid var(--line); border-bottom: 2px solid var(--line);
    transform: rotate(45deg); border-bottom-left-radius: 4px;
  }
  .bubble.pop { animation: pop .25s ease; }
  .spark { color: var(--gold); }

  /* 記録パネル */
  .cook {
    background: var(--surface); border: 2px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow);
    padding: 16px; display: flex; flex-direction: column; gap: 12px;
  }
  .seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; background: var(--surface-2); border-radius: 12px; padding: 4px; }
  .seg button {
    border: 0; background: transparent; border-radius: 9px; padding: 8px 0; font-weight: 700; color: var(--muted);
  }
  .seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  .go {
    border: 0; border-radius: 999px; background: var(--accent); color: var(--accent-ink);
    box-shadow: 0 6px 0 color-mix(in srgb, var(--accent) 70%, #000 12%);
    padding: 18px 12px; display: flex; flex-direction: column; align-items: center; gap: 0;
    font-family: var(--display); font-weight: 900; font-size: 26px; line-height: 1.2;
    transition: transform .12s ease;
  }
  .go span { font-size: 14px; font-weight: 700; opacity: .9; }
  .go:active { transform: translateY(4px); box-shadow: 0 2px 0 color-mix(in srgb, var(--accent) 70%, #000 12%); }
  .tweak-toggle { background: none; border: 0; color: var(--muted); font-size: 13px; padding: 0; align-self: center; text-decoration: underline; text-underline-offset: 3px; }
  .tweak { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .field { display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; color: var(--muted); }
  .field input {
    width: 100%; box-sizing: border-box; border: 1px solid var(--line); border-radius: 10px;
    background: var(--bg); padding: 8px 10px; font-size: 16px; color: var(--ink);
  }

  /* 食材費 */
  .shop { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .shop-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .shop-total { font-family: var(--display); font-weight: 700; font-size: 22px; }
  .shop-add { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
  .shop-add input {
    width: 100%; box-sizing: border-box; border: 1px solid var(--line); border-radius: 12px;
    background: var(--bg); padding: 10px 12px; font-size: 16px; color: var(--ink);
  }
  .shop-note { margin: 0; font-size: 12.5px; color: var(--muted); line-height: 1.7; }
  .shop-note b { color: var(--ink); }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .month-head {
    display: flex; justify-content: space-between; align-items: baseline; gap: 12px;
    border-bottom: 2px solid var(--line); padding-bottom: 6px;
  }
  .month-head b { font-family: var(--display); font-size: 18px; }
  .month-head span { font-size: 12px; color: var(--muted); text-align: right; }
  .row .minus { font-family: var(--display); font-weight: 700; color: var(--muted); }

  /* 数字の列 */
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .stat { background: var(--surface); border-radius: 18px; box-shadow: var(--shadow); padding: 10px 12px; display: flex; flex-direction: column; }
  .stat .k { font-size: 11.5px; color: var(--muted); }
  .stat .v { font-family: var(--display); font-weight: 700; font-size: 20px; line-height: 1.3; }
  .stat .v small { font-size: 12px; font-weight: 500; margin-left: 1px; }

  /* 貯金びん */
  .jar-card {
    background: var(--surface); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow);
    display: grid; grid-template-columns: 104px 1fr; gap: 16px; align-items: center;
  }
  .jar-card svg { width: 104px; height: auto; display: block; }
  .jar-info { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .jar-info h2 { margin: 0; font-family: var(--display); font-size: 18px; font-weight: 700; text-wrap: balance; overflow-wrap: anywhere; }
  .jar-info .pct { font-family: var(--display); font-weight: 900; font-size: 32px; color: var(--gold); line-height: 1.1; }
  .jar-info .sub { font-size: 13px; color: var(--muted); }
  #jarFill { transition: y .6s ease, height .6s ease; }

  /* 履歴 */
  .day { display: flex; flex-direction: column; gap: 6px; }
  .day h3 { margin: 0; font-size: 13px; color: var(--muted); font-weight: 500; display: flex; justify-content: space-between; }
  .day h3 b { color: var(--accent); font-weight: 700; }
  .row {
    background: var(--surface); border-radius: 12px; padding: 10px 12px;
    display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center;
  }
  .tag { font-weight: 700; font-size: 13px; background: var(--surface-2); border-radius: 8px; padding: 2px 8px; }
  .row .calc { font-size: 12.5px; color: var(--muted); }
  .row .plus { font-family: var(--display); font-weight: 700; color: var(--accent); }
  .del { border: 0; background: none; color: var(--muted); font-size: 12px; padding: 4px 6px; border-radius: 8px; }
  .del.armed { color: var(--danger); background: var(--surface-2); font-weight: 700; }
  .empty { color: var(--muted); text-align: center; padding: 32px 0; }

  /* 設定 */
  .section { background: var(--surface); border-radius: var(--radius); padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .section h2 { margin: 0; font-size: 15px; }
  .section p { margin: 0; font-size: 13px; color: var(--muted); }
  .meal-row { display: grid; grid-template-columns: 2.2em 1fr 1fr; gap: 10px; align-items: end; }
  .meal-row .tag { text-align: center; padding: 8px 0; }
  .btn { border: 0; background: var(--surface-2); color: var(--accent); border-radius: 999px; padding: 10px 14px; font-weight: 700; }
  .btn.danger { color: var(--danger); }
  .btn.danger.armed { background: var(--danger); color: var(--surface); border-color: var(--danger); }
  .save-note { font-size: 12px; color: var(--muted); }

  /* タブバー */
  nav {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
    background: var(--surface); border-top: 1px solid var(--line);
    padding: 6px 16px calc(6px + env(safe-area-inset-bottom, 0px));
  }
  nav .tabs { max-width: 480px; margin: 0 auto; display: grid; grid-template-columns: repeat(3, 1fr); }
  nav button { border: 0; background: none; padding: 8px 0; font-size: 13px; color: var(--muted); font-weight: 700; }
  nav button[aria-current="page"] { color: var(--accent); background: var(--surface-2); border-radius: 999px; }

  /* トースト */
  .toast {
    position: fixed; left: 16px; right: 16px; z-index: 20;
    bottom: calc(76px + env(safe-area-inset-bottom, 0px));
    max-width: 448px; margin: 0 auto;
    background: var(--ink); color: var(--bg); border-radius: 14px; padding: 12px 16px;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    font-weight: 700;
  }
  .toast button { background: var(--accent); border: 0; color: var(--accent-ink); font-weight: 700; padding: 4px 12px; border-radius: 999px; white-space: nowrap; }
  @keyframes pop { from { transform: translateY(8px); opacity: .4; } to { transform: none; opacity: 1; } }
  .toast:not([hidden]) { animation: pop .2s ease; }
  @keyframes bump { 50% { transform: scale(1.06); } }
  .bump { animation: bump .35s ease; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>

<main class="wrap">
  <!-- ホーム -->
  <section id="view-home" style="display:contents">
    <div class="demo" id="demoBar" hidden>
      <span>お試しデータを表示しています</span>
      <button type="button" id="demoClear">消して始める</button>
    </div>

    <div class="buddy">
      <button type="button" id="buddyBtn" aria-label="おにぎりに話しかける">
        <svg class="mascot" id="mascot" viewBox="0 0 120 120" aria-hidden="true">
          <g class="down">
            <path class="arm arm-line" d="M30 78 q-10 4 -12 14"/><path class="arm arm-fill" d="M30 78 q-10 4 -12 14"/>
            <path class="arm arm-line" d="M90 78 q10 4 12 14"/><path class="arm arm-fill" d="M90 78 q10 4 12 14"/>
          </g>
          <g class="up">
            <path class="arm arm-line" d="M34 66 q-12 -6 -16 -22"/><path class="arm arm-fill" d="M34 66 q-12 -6 -16 -22"/>
            <path class="arm arm-line" d="M86 66 q12 -6 16 -22"/><path class="arm arm-fill" d="M86 66 q12 -6 16 -22"/>
            <path d="M12 36 l2 -6 l2 6 l6 2 l-6 2 l-2 6 l-2 -6 l-6 -2 z" style="fill:var(--gold)"/>
            <path d="M104 30 l1.5 -4.5 l1.5 4.5 l4.5 1.5 l-4.5 1.5 l-1.5 4.5 l-1.5 -4.5 l-4.5 -1.5 z" style="fill:var(--accent)"/>
          </g>
          <path d="M60 12 c9 0 15 6 20 14 l26 45 c8 14 0 30 -17 30 h-58 c-17 0 -25 -16 -17 -30 l26 -45 c5 -8 11 -14 20 -14 z" fill="#FFFFFF" style="stroke:var(--line)" stroke-width="3"/>
          <rect x="39" y="72" width="42" height="29" rx="4" fill="#3B3A45"/>
          <circle cx="60" cy="86.5" r="9.5" fill="#FFC93C"/>
          <text x="60" y="91" text-anchor="middle" font-family="Arial, sans-serif" font-weight="900" font-size="12" fill="#3B3A45">¥</text>
          <g class="calm" fill="#3B3A45"><circle cx="48" cy="54" r="3.4"/><circle cx="72" cy="54" r="3.4"/></g>
          <g class="joy" fill="none" stroke="#3B3A45" stroke-width="3" stroke-linecap="round"><path d="M44 55 q4 -6 8 0"/><path d="M68 55 q4 -6 8 0"/></g>
          <path class="calm" d="M55 61 q5 5 10 0" fill="none" stroke="#3B3A45" stroke-width="2.6" stroke-linecap="round"/>
          <path class="joy" d="M54 60 h12 q0 8 -6 8 q-6 0 -6 -8 z" fill="#FF6F61"/>
          <ellipse cx="42" cy="61" rx="5" ry="3.2" fill="#FFB3A7"/><ellipse cx="78" cy="61" rx="5" ry="3.2" fill="#FFB3A7"/>
        </svg>
      </button>
      <p class="bubble" id="bubble" role="status">今日もなにか作ってみよ〜？</p>
    </div>

    <div class="hero">
      <span class="eyebrow" id="monthLabel">今月 自炊で浮いたお金</span>
      <div class="big yen" id="monthTotal"><small>¥</small>0</div>
      <button type="button" class="swap" id="swap" aria-label="ほかのものに換算する">
        <span id="swapName">ラーメン</span><b class="yen" id="swapCount">0</b><span id="swapUnit">杯分</span>
        <span class="hint">タップで切り替え</span>
      </button>
      <div class="chips" id="chips"></div>
    </div>

    <div class="cook">
      <div class="seg" role="group" aria-label="どのごはん？">
        <button type="button" data-meal="b" aria-pressed="false">朝</button>
        <button type="button" data-meal="l" aria-pressed="false">昼</button>
        <button type="button" data-meal="d" aria-pressed="false">夜</button>
      </div>
      <button type="button" class="go" id="go">作った！<span id="goSub">+¥600 浮く</span></button>
      <button type="button" class="tweak-toggle" id="tweakToggle" aria-expanded="false">金額を変える</button>
      <div class="tweak" id="tweak" hidden>
        <label class="field">外食なら<input id="tOut" type="number" inputmode="numeric" min="0" step="10"></label>
        <label class="field">材料費<input id="tCook" type="number" inputmode="numeric" min="0" step="10"></label>
      </div>
    </div>

    <div class="shop">
      <div class="shop-head"><span class="eyebrow" id="shopLabel">今月の食材費</span><span class="shop-total yen" id="shopTotal">¥0</span></div>
      <form class="shop-add" id="shopForm">
        <label class="sr" for="shopAmt">買った金額</label>
        <input id="shopAmt" type="number" inputmode="numeric" min="1" step="1" placeholder="食材を買った金額（例：1280）">
        <button class="btn" type="submit">追加</button>
      </form>
      <p class="shop-note" id="shopNote"></p>
    </div>

    <div class="stats">
      <div class="stat"><span class="k">これまでの合計</span><span class="v yen" id="allTotal">¥0</span></div>
      <div class="stat"><span class="k">連続自炊</span><span class="v yen"><span id="streak">0</span><small>日</small></span></div>
      <div class="stat"><span class="k">今月の自炊</span><span class="v yen"><span id="monthCount">0</span><small>回</small></span></div>
    </div>

    <div class="jar-card">
      <svg viewBox="0 0 120 150" role="img" aria-labelledby="jarTitle">
        <title id="jarTitle">目標までの貯金びん</title>
        <defs>
          <clipPath id="jarClip">
            <path d="M40 22 h40 v6 c0 6 20 12 20 32 v66 c0 12 -8 20 -20 20 h-40 c-12 0 -20 -8 -20 -20 v-66 c0 -20 20 -26 20 -32 z"/>
          </clipPath>
        </defs>
        <rect x="34" y="6" width="52" height="14" rx="4" style="fill:var(--gold)"/>
        <path d="M40 22 h40 v6 c0 6 20 12 20 32 v66 c0 12 -8 20 -20 20 h-40 c-12 0 -20 -8 -20 -20 v-66 c0 -20 20 -26 20 -32 z" style="fill:var(--surface-2)"/>
        <g clip-path="url(#jarClip)">
          <rect id="jarFill" x="0" y="146" width="120" height="0" style="fill:var(--gold)"/>
          <g id="coins" style="fill:var(--gold-soft)" opacity=".7"></g>
        </g>
        <path d="M40 22 h40 v6 c0 6 20 12 20 32 v66 c0 12 -8 20 -20 20 h-40 c-12 0 -20 -8 -20 -20 v-66 c0 -20 20 -26 20 -32 z" fill="none" style="stroke:var(--ink)" stroke-width="3" stroke-linejoin="round"/>
        <path d="M30 64 v44" style="stroke:var(--surface)" stroke-width="4" stroke-linecap="round" opacity=".6"/>
      </svg>
      <div class="jar-info">
        <span class="eyebrow">目標</span>
        <h2 id="goalName">旅行の資金</h2>
        <span class="pct yen" id="goalPct">0%</span>
        <span class="sub yen" id="goalSub">¥0 / ¥30,000</span>
      </div>
    </div>
  </section>

  <!-- 履歴 -->
  <section id="view-log" hidden style="display:flex;flex-direction:column;gap:16px">
    <div class="hero">
      <span class="eyebrow">履歴</span>
      <div class="big yen" style="font-size:36px" id="logTotal"><small>¥</small>0</div>
      <span class="sub" style="color:var(--muted);font-size:13px">これまでに浮いたお金</span>
    </div>
    <div id="logList" style="display:flex;flex-direction:column;gap:16px"></div>
  </section>

  <!-- 設定 -->
  <section id="view-settings" hidden style="display:flex;flex-direction:column;gap:16px">
    <div class="hero"><span class="eyebrow">設定</span></div>
    <form class="section" id="mealForm">
      <h2>ふだんの金額</h2>
      <p>「作った！」を押したときは、この金額で計算します。</p>
      <div class="meal-row"><span class="tag">朝</span>
        <label class="field">外食なら<input id="s-b-out" type="number" inputmode="numeric" min="0" step="10"></label>
        <label class="field">材料費<input id="s-b-cook" type="number" inputmode="numeric" min="0" step="10"></label></div>
      <div class="meal-row"><span class="tag">昼</span>
        <label class="field">外食なら<input id="s-l-out" type="number" inputmode="numeric" min="0" step="10"></label>
        <label class="field">材料費<input id="s-l-cook" type="number" inputmode="numeric" min="0" step="10"></label></div>
      <div class="meal-row"><span class="tag">夜</span>
        <label class="field">外食なら<input id="s-d-out" type="number" inputmode="numeric" min="0" step="10"></label>
        <label class="field">材料費<input id="s-d-cook" type="number" inputmode="numeric" min="0" step="10"></label></div>
      <button class="btn" type="submit">保存</button>
      <div id="calibBox" hidden style="display:flex;flex-direction:column;gap:8px">
        <p id="calibText"></p>
        <button class="btn" type="button" id="calibBtn">材料費をこの単価に合わせる</button>
      </div>
    </form>
    <form class="section" id="goalForm">
      <h2>目標</h2>
      <p>浮いたお金で何を買いたいですか？</p>
      <label class="field">欲しいもの<input id="g-name" type="text" maxlength="30"></label>
      <label class="field">金額<input id="g-amount" type="number" inputmode="numeric" min="0" step="100"></label>
      <button class="btn" type="submit">保存</button>
    </form>
    <div class="section">
      <h2>データ</h2>
      <p class="save-note" id="saveNote">記録はこの端末に保存されます。</p>
      <button class="btn danger" type="button" id="resetBtn">すべての記録を消す</button>
    </div>
  </section>
</main>

<nav aria-label="画面の切り替え">
  <div class="tabs">
    <button type="button" data-view="home" aria-current="page">ホーム</button>
    <button type="button" data-view="log">履歴</button>
    <button type="button" data-view="settings">設定</button>
  </div>
</nav>

<div class="toast" id="toast" role="status" hidden>
  <span id="toastText"></span>
  <button type="button" id="toastUndo">取り消す</button>
</div>

<script>
(() => {
  const KEY = "jisui-savings-v1";
  const MEALS = { b: "朝", l: "昼", d: "夜" };
  const THINGS = [
    { name: "ラーメン", unit: "杯分", price: 900 },
    { name: "コンビニ弁当", unit: "個分", price: 550 },
    { name: "カフェラテ", unit: "杯分", price: 480 },
    { name: "映画", unit: "回分", price: 1900 },
    { name: "回転寿司", unit: "皿分", price: 120 },
    { name: "焼肉ランチ", unit: "回分", price: 1500 },
  ];
  const DEFAULTS = () => ({
    v: 1,
    demo: false,
    settings: {
      meals: { b: { out: 450, cook: 150 }, l: { out: 900, cook: 300 }, d: { out: 1300, cook: 450 } },
      goal: { name: "旅行の資金", amount: 30000 },
    },
    entries: [],
    groceries: [],
  });

  const $ = (id) => document.getElementById(id);
  const yen = (n) => "¥" + Math.round(n).toLocaleString("ja-JP");
  const saved = (e) => Math.max(0, e.o - e.c);
  const monthKey = (t) => { const d = new Date(t); return d.getFullYear() * 12 + d.getMonth(); };
  const dayKey = (t) => { const d = new Date(t); return d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate(); };
  const num = (v, fallback) => { const n = Number(v); return Number.isFinite(n) && n >= 0 ? Math.round(n) : fallback; };

  // ---- お試しデータ（初回のみ） ----
  function demoState() {
    const s = DEFAULTS();
    s.demo = true;
    const now = new Date();
    const pattern = ["ld", "d", "bld", "", "d", "ld", "bd", "d", "l", "d", "bld", "d"];
    pattern.forEach((meals, i) => {
      for (const m of meals) {
        const d = new Date(now.getFullYear(), now.getMonth(), now.getDate() - (pattern.length - 1 - i),
          m === "b" ? 8 : m === "l" ? 12 : 19, 30);
        if (d > now) continue;
        const base = s.settings.meals[m];
        s.entries.push({ id: "demo" + i + m, t: d.getTime(), m, o: base.out, c: base.cook });
      }
    });
    [[10, 4280], [6, 860], [2, 1530]].forEach(([ago, a], i) => {
      const d = new Date(now.getFullYear(), now.getMonth(), now.getDate() - ago, 18, 0);
      s.groceries.push({ id: "demog" + i, t: d.getTime(), a });
    });
    return s;
  }

  // ---- 保存（端末内。claude.ai 上ではアカウントにも保存） ----
  let state;
  try { state = JSON.parse(localStorage.getItem(KEY)); } catch { state = null; }
  if (!state || !Array.isArray(state.entries)) state = demoState();
  if (!Array.isArray(state.groceries)) state.groceries = [];

  let cloud = null; // { ref }
  let writing = false, pending = false;

  function persist() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch {}
    if (cloud) pushCloud();
  }
  async function pushCloud() {
    if (writing) { pending = true; return; }
    writing = true;
    try { await cloud.ref.set({ json: JSON.stringify(state) }); } catch {}
    writing = false;
    if (pending) { pending = false; pushCloud(); }
  }
  async function connectCloud() {
    if (!window.claude || typeof window.claude.use !== "function") return;
    try {
      const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
      if (!db || !user) return;
      const id = await user.id();
      if (!id) return;
      const ref = db.doc("data/users/" + id + "/state");
      const snap = await ref.get();
      cloud = { ref };
      $("saveNote").textContent = "記録はあなたのアカウントに保存されます（ほかの人には見えません）。";
      const remote = snap.exists ? JSON.parse(snap.data().json || "null") : null;
      if (remote && Array.isArray(remote.entries)) {
        state = remote;
        if (!Array.isArray(state.groceries)) state.groceries = [];
        try { localStorage.setItem(KEY, JSON.stringify(state)); } catch {}
        renderAll();
      } else if (!state.demo) {
        pushCloud();
      }
    } catch { cloud = null; }
  }

  // ---- 計算 ----
  // 月の途中は目安の材料費で計算し、月が終わったら「食材費の合計」で確定する
  function monthStats(key) {
    const es = state.entries.filter((e) => monthKey(e.t) === key);
    const gs = state.groceries.filter((g) => monthKey(g.t) === key);
    const out = es.reduce((a, e) => a + e.o, 0);
    const estimate = es.reduce((a, e) => a + saved(e), 0);
    const food = gs.reduce((a, g) => a + g.a, 0);
    const current = key === monthKey(Date.now());
    const final = !current && gs.length > 0;
    return {
      key, count: es.length, shops: gs.length, out, food, estimate, final,
      actual: out - food,
      perMeal: es.length && gs.length ? food / es.length : null,
      saved: final ? out - food : estimate,
    };
  }
  function allMonths() {
    const keys = new Set([...state.entries, ...state.groceries].map((x) => monthKey(x.t)));
    return [...keys].sort((a, b) => b - a).map(monthStats);
  }
  function sums() {
    const cur = monthStats(monthKey(Date.now()));
    const all = allMonths().reduce((a, m) => a + m.saved, 0);
    return { all: Math.max(0, all), month: cur.estimate, monthCount: cur.count, cur };
  }
  function streak() {
    const days = new Set(state.entries.map((e) => dayKey(e.t)));
    const d = new Date();
    if (!days.has(dayKey(d))) d.setDate(d.getDate() - 1);
    let n = 0;
    while (days.has(dayKey(d))) { n++; d.setDate(d.getDate() - 1); }
    return n;
  }

  // ---- ホーム ----
  let meal = (() => { const h = new Date().getHours(); return h < 10 ? "b" : h < 16 ? "l" : "d"; })();
  let thingIdx = 0, thingPicked = false;

  function currentAmounts() {
    const base = state.settings.meals[meal];
    if ($("tweak").hidden) return { o: base.out, c: base.cook };
    return { o: num($("tOut").value, base.out), c: num($("tCook").value, base.cook) };
  }
  function renderCook() {
    document.querySelectorAll(".seg button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.meal === meal)));
    const base = state.settings.meals[meal];
    $("tOut").value = base.out;
    $("tCook").value = base.cook;
    renderGoSub();
  }
  function renderGoSub() {
    const a = currentAmounts();
    $("goSub").textContent = MEALS[meal] + "ごはん　+" + yen(Math.max(0, a.o - a.c)) + " 浮く";
  }
  function renderHome() {
    const s = sums();
    const now = new Date();
    $("monthLabel").textContent = (now.getMonth() + 1) + "月　自炊で浮いたお金";
    $("monthTotal").innerHTML = "<small>¥</small>" + Math.round(s.month).toLocaleString("ja-JP");
    // 自分で切り替えるまでは、1つ以上になるいちばん高いものを見せる（0杯分はさみしいので）
    if (!thingPicked) {
      const ok = THINGS.map((x, i) => [x, i]).filter(([x]) => s.month >= x.price).sort((a, b) => b[0].price - a[0].price);
      thingIdx = ok.length ? ok[0][1] : THINGS.length - 2;
    }
    const t = THINGS[thingIdx];
    $("swapName").textContent = t.name;
    $("swapCount").textContent = Math.floor(s.month / t.price).toLocaleString("ja-JP");
    $("swapUnit").textContent = t.unit;
    $("chips").innerHTML = THINGS.filter((x, i) => i !== thingIdx && s.month >= x.price).map((x) =>
      '<span class="chip">' + x.name + ' <b class="yen">' + Math.floor(s.month / x.price).toLocaleString("ja-JP") + "</b>" + x.unit.replace("分", "") + "</span>"
    ).join("");
    $("allTotal").textContent = yen(s.all);
    $("streak").textContent = streak();
    $("monthCount").textContent = s.monthCount;
    $("demoBar").hidden = !state.demo;

    const c = s.cur;
    $("shopLabel").textContent = (now.getMonth() + 1) + "月の食材費";
    $("shopTotal").textContent = yen(c.food);
    $("shopNote").innerHTML = c.shops && c.count
      ? "買い物 " + c.shops + "回 ÷ 自炊 " + c.count + "回 ＝ 1食 <b class=\"yen\">" + yen(c.perMeal) + "</b><br>" +
        "月末にこの合計で確定します。今の時点で確定すると <b class=\"yen\">" + yen(Math.max(0, c.actual)) + "</b>（まとめ買いの直後は少なめに出ます）"
      : "食材を買ったら、その金額を足していってください。月末に「食材費の合計 ÷ 作った回数」で浮いたお金を確定します。";

    const g = state.settings.goal;
    const p = g.amount > 0 ? Math.min(1, s.all / g.amount) : 0;
    $("goalName").textContent = g.name || "目標";
    $("goalPct").textContent = Math.floor(p * 100) + "%";
    $("goalSub").textContent = p >= 1 ? "達成！ " + yen(s.all) + " 貯まりました" : yen(s.all) + " / " + yen(g.amount) + "（あと " + yen(g.amount - s.all) + "）";
    const top = 22, bottom = 146, h = (bottom - top) * p;
    $("jarFill").setAttribute("y", String(bottom - h));
    $("jarFill").setAttribute("height", String(h));
    // コインの模様
    let coins = "";
    for (let y = bottom - 8, row = 0; y > bottom - h + 4; y -= 11, row++) {
      for (let x = 30 + (row % 2) * 8; x < 96; x += 16) coins += '<ellipse cx="' + x + '" cy="' + y + '" rx="6" ry="2.6"/>';
    }
    $("coins").innerHTML = coins;
  }

  // ---- 履歴 ----
  let armedId = null;
  function renderLog() {
    $("logTotal").innerHTML = "<small>¥</small>" + Math.round(sums().all).toLocaleString("ja-JP");
    const list = [...state.entries, ...state.groceries].sort((a, b) => b.t - a.t);
    if (!list.length) { $("logList").innerHTML = '<p class="empty">まだ記録がありません。<br>ごはんを作ったら「作った！」を押してね。</p>'; return; }
    const months = new Map(allMonths().map((m) => [m.key, m]));
    const wd = ["日", "月", "火", "水", "木", "金", "土"];
    const delBtn = (id) => '<button type="button" class="del' + (armedId === id ? " armed" : "") + '" data-id="' + id + '">' + (armedId === id ? "本当に消す" : "消す") + "</button>";
    let html = "", lastMonth = null, lastDay = null;
    for (const x of list) {
      const mk = monthKey(x.t), dk = dayKey(x.t), d = new Date(x.t);
      if (mk !== lastMonth) {
        if (lastDay !== null) html += "</div>";
        const m = months.get(mk);
        const how = m.final
          ? "確定：外食 " + yen(m.out) + " − 食材費 " + yen(m.food) + "<br>1食 " + yen(m.perMeal) + "（" + m.count + "回）"
          : m.shops ? "月末に確定　食材費 " + yen(m.food) + " ÷ " + m.count + "回" : "目安の材料費で計算中";
        html += '<div class="month-head"><b class="yen">' + (d.getMonth() + 1) + "月 +" + yen(m.saved) + '</b><span class="yen">' + how + "</span></div>";
        lastMonth = mk; lastDay = null;
      }
      if (dk !== lastDay) {
        if (lastDay !== null) html += "</div>";
        const dayTotal = state.entries.filter((e) => dayKey(e.t) === dk).reduce((a, e) => a + saved(e), 0);
        html += '<div class="day"><h3><span>' + (d.getMonth() + 1) + "/" + d.getDate() + "（" + wd[d.getDay()] + '）</span><b class="yen">' + (dayTotal ? "+" + yen(dayTotal) : "") + "</b></h3>";
        lastDay = dk;
      }
      html += "a" in x
        ? '<div class="row"><span class="tag">買</span><span class="calc yen">食材の買い物<br><span class="minus">' + yen(x.a) + "</span></span>" + delBtn(x.id) + "</div>"
        : '<div class="row"><span class="tag">' + MEALS[x.m] + '</span><span class="calc yen">外食 ' + yen(x.o) + " − 材料 " + yen(x.c) +
          '<br><span class="plus">+' + yen(saved(x)) + "</span></span>" + delBtn(x.id) + "</div>";
    }
    if (lastDay !== null) html += "</div>";
    $("logList").innerHTML = html;
  }

  // ---- 設定 ----
  function renderSettings() {
    for (const m of Object.keys(MEALS)) {
      $("s-" + m + "-out").value = state.settings.meals[m].out;
      $("s-" + m + "-cook").value = state.settings.meals[m].cook;
    }
    const last = allMonths().find((m) => m.final && m.count);
    $("calibBox").hidden = !last;
    if (last) {
      const d = new Date(Math.floor(last.key / 12), last.key % 12, 1);
      $("calibText").innerHTML = (d.getMonth() + 1) + "月の実際の材料費は 1食 <b class=\"yen\">" + yen(last.perMeal) + "</b> でした（食材費 " + yen(last.food) + " ÷ " + last.count + "回）。";
    }
    $("g-name").value = state.settings.goal.name;
    $("g-amount").value = state.settings.goal.amount;
  }

  function renderAll() { renderCook(); renderHome(); renderLog(); renderSettings(); say(idleLine(), false); }

  // ---- おにぎりのセリフ ----
  const CHEERS = [
    "卵かけご飯だって立派な自炊だよ！",
    "作ったぶんだけ、ちゃんと貯まってる♪",
    "無理しないのがいちばん。できる日にやろ〜",
    "冷凍ごはんは未来の自分へのプレゼント！",
    "今日もおつかれさま。えらいよ〜",
    "外食も楽しんでOK！そのぶん自炊でバランス♪",
  ];
  let cheerIdx = -1;
  function idleLine() {
    const today = state.entries.filter((e) => dayKey(e.t) === dayKey(Date.now())).length;
    const st = streak(), s = sums();
    const g = state.settings.goal;
    if (!state.entries.length || state.demo) return "はじめまして！ごはん作ったら「作った！」を押してね。いっしょに貯めよ〜";
    if (today >= 2) return "今日はもう" + today + "回も作ってる…！天才では？";
    if (today === 1) return st >= 2 ? st + "日連続！この調子この調子♪" : "今日も作ってえらい！明日もゆるっといこ〜";
    if (st >= 1) return "きのうまで" + st + "日連続！今日もつなげちゃう？";
    if (g.amount > 0 && s.all >= g.amount) return "「" + g.name + "」の目標、達成してるよ！すごすぎ〜！";
    return "今日もなにか作ってみよ〜？卵かけご飯でもえらいよ！";
  }
  let sayTimer;
  function say(text, cheer) {
    const b = $("bubble");
    b.textContent = text;
    b.classList.remove("pop"); void b.offsetWidth; b.classList.add("pop");
    const m = $("mascot");
    clearTimeout(sayTimer);
    m.classList.remove("cheer");
    if (cheer) {
      void m.getBoundingClientRect(); m.classList.add("cheer");
      sayTimer = setTimeout(() => m.classList.remove("cheer"), 2600);
    }
  }
  function cookLine(e) {
    const st = streak(), s = sums();
    const g = state.settings.goal;
    const left = g.amount - s.all;
    const t = THINGS[Math.floor(Math.random() * 3)];
    const lines = [
      "+" + yen(saved(e)) + "！すごい、えらい〜！",
      "これで今月" + t.name + Math.floor(s.month / t.price) + t.unit.replace("分", "") + "ぶん浮いたよ♪",
    ];
    if (st >= 2) lines.push(st + "日連続だよ！まじでえらい！");
    if (g.amount > 0 && left > 0) lines.push("「" + g.name + "」まで、あと" + yen(left) + "！");
    if (g.amount > 0 && left <= 0) lines.push("目標達成！！「" + g.name + "」いっちゃお〜！");
    return lines[Math.floor(Math.random() * lines.length)];
  }

  // ---- 操作 ----
  let toastTimer, lastId = null;
  function toast(text, undoable) {
    $("toastText").textContent = text;
    $("toastUndo").hidden = !undoable;
    $("toast").hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { $("toast").hidden = true; }, 4000);
  }

  document.querySelectorAll(".seg button").forEach((b) => b.addEventListener("click", () => { meal = b.dataset.meal; renderCook(); }));
  $("tweakToggle").addEventListener("click", () => {
    const open = $("tweak").hidden;
    $("tweak").hidden = !open;
    $("tweakToggle").setAttribute("aria-expanded", String(open));
    $("tweakToggle").textContent = open ? "いつもの金額に戻す" : "金額を変える";
    renderCook();
  });
  $("tOut").addEventListener("input", renderGoSub);
  $("tCook").addEventListener("input", renderGoSub);

  $("go").addEventListener("click", () => {
    if (state.demo) { state.entries = []; state.groceries = []; state.demo = false; }
    const a = currentAmounts();
    const e = { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), t: Date.now(), m: meal, o: a.o, c: a.c };
    state.entries.push(e);
    lastId = e.id;
    persist();
    if (!$("tweak").hidden) $("tweakToggle").click();
    renderHome(); renderLog();
    $("monthTotal").classList.remove("bump"); void $("monthTotal").offsetWidth; $("monthTotal").classList.add("bump");
    toast("+" + yen(saved(e)) + " 記録しました", true);
    say(cookLine(e), true);
  });
  $("toastUndo").addEventListener("click", () => {
    state.entries = state.entries.filter((e) => e.id !== lastId);
    state.groceries = state.groceries.filter((g) => g.id !== lastId);
    persist(); renderHome(); renderLog();
    toast("取り消しました", false);
    say(idleLine(), false);
  });
  $("buddyBtn").addEventListener("click", () => {
    cheerIdx = (cheerIdx + 1) % CHEERS.length;
    say(CHEERS[cheerIdx], true);
  });
  $("swap").addEventListener("click", () => { thingIdx = (thingIdx + 1) % THINGS.length; thingPicked = true; renderHome(); });
  $("demoClear").addEventListener("click", () => { state.entries = []; state.groceries = []; state.demo = false; persist(); renderAll(); });
  $("shopForm").addEventListener("submit", (ev) => {
    ev.preventDefault();
    const a = num($("shopAmt").value, 0);
    if (!a) { toast("金額を入れてください", false); return; }
    if (state.demo) { state.entries = []; state.groceries = []; state.demo = false; }
    state.groceries.push({ id: "g" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), t: Date.now(), a });
    lastId = state.groceries[state.groceries.length - 1].id;
    $("shopAmt").value = "";
    $("shopAmt").blur();
    persist(); renderHome(); renderLog();
    toast("食材費 " + yen(a) + " を足しました", true);
    say("買い出しおつかれさま！これでいっぱい作れるね♪", true);
  });
  $("calibBtn").addEventListener("click", () => {
    const last = allMonths().find((m) => m.final && m.count);
    if (!last) return;
    const es = state.entries.filter((e) => monthKey(e.t) === last.key);
    const avgNow = es.reduce((a, e) => a + state.settings.meals[e.m].cook, 0) / es.length;
    const ratio = avgNow > 0 ? last.perMeal / avgNow : 1;
    for (const m of Object.keys(MEALS)) {
      const cur = state.settings.meals[m];
      cur.cook = Math.round((cur.cook * ratio) / 10) * 10;
    }
    persist(); renderAll(); toast("材料費を実際の単価に合わせました", false);
  });

  $("logList").addEventListener("click", (ev) => {
    const b = ev.target.closest(".del"); if (!b) return;
    if (armedId === b.dataset.id) {
      state.entries = state.entries.filter((e) => e.id !== armedId);
      state.groceries = state.groceries.filter((g) => g.id !== armedId);
      armedId = null; persist(); renderHome();
    } else armedId = b.dataset.id;
    renderLog();
  });

  $("mealForm").addEventListener("submit", (ev) => {
    ev.preventDefault();
    for (const m of Object.keys(MEALS)) {
      const cur = state.settings.meals[m];
      state.settings.meals[m] = { out: num($("s-" + m + "-out").value, cur.out), cook: num($("s-" + m + "-cook").value, cur.cook) };
    }
    persist(); renderAll(); toast("金額を保存しました", false);
  });
  $("goalForm").addEventListener("submit", (ev) => {
    ev.preventDefault();
    state.settings.goal = { name: $("g-name").value.trim() || "目標", amount: num($("g-amount").value, state.settings.goal.amount) };
    persist(); renderAll(); toast("目標を保存しました", false);
  });
  let resetArmed = false;
  $("resetBtn").addEventListener("click", () => {
    if (!resetArmed) { resetArmed = true; $("resetBtn").classList.add("armed"); $("resetBtn").textContent = "もう一度押すと消えます"; return; }
    state.entries = []; state.groceries = []; state.demo = false; persist(); renderAll();
    resetArmed = false; $("resetBtn").classList.remove("armed"); $("resetBtn").textContent = "すべての記録を消す";
    toast("記録を消しました", false);
  });

  // ---- タブ ----
  const views = { home: "view-home", log: "view-log", settings: "view-settings" };
  function show(v) {
    for (const [k, id] of Object.entries(views)) $(id).hidden = k !== v;
    document.querySelectorAll("nav button").forEach((b) => {
      if (b.dataset.view === v) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current");
    });
    window.scrollTo(0, 0);
  }
  document.querySelectorAll("nav button").forEach((b) => b.addEventListener("click", () => show(b.dataset.view)));

  renderAll();
  connectCloud();
})();
</script>
